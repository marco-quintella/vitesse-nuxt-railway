[build]
builder = "RAILPACK"

[deploy]
# Start gerado pelo Railpack: `node .output/server/index.mjs` (script start do package.json)
# Healthcheck: rota /api/health (server/api/health.ts)
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Nota: variáveis de template (prompts do wizard) são configuradas na UI do
# Railway ao criar/publicar o template (Dashboard → Templates), NÃO aqui.
